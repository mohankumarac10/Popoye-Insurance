
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Popoye Insurance</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body class="login-body">

    <main class="login-container">
        <section class="login-brand">
            <img src="images/logo.png" alt="Popoye Insurance Logo"
                 class="login-logo">

            <h1>Popoye Insurance</h1>
            <p>Your trusted two-wheeler insurance management system.</p>

            <div class="login-features">
                <p> Customer Management</p>
                <p> Policy Renewals</p>
                <p> Payment Tracking</p>
                <p> Insurance Analytics</p>
            </div>
        </section>

        <section class="login-form-section">
            <h2>Welcome Back!</h2>
            <p class="muted-text">Sign in to access your dashboard.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="admin@popoyeinsurance.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                           placeholder="Enter your password"
                           required>
                </div>

                <p id="loginMessage" class="login-message"
                   role="alert"></p>

                <button type="submit" class="primary-btn login-btn">
                    Login to Dashboard
                </button>
            </form>

            <p class="login-footer">
                © 2026 Popoye Insurance. All rights reserved.
            </p>
        </section>
    </main>

</body>
</html>
