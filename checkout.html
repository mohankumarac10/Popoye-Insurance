
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popoye Insurance | Secure Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #202124;
        }

        header {
            background: #171717;
            color: white;
            padding: 18px 7%;
            border-bottom: 4px solid #e32636;
            font-size: 22px;
            font-weight: bold;
        }

        header span {
            color: #ff4655;
        }

        main {
            max-width: 600px;
            margin: 35px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 26px;
            border-radius: 12px;
            box-shadow: 0 4px 20px #0000000d;
        }

        h1 {
            font-size: 25px;
            margin-top: 0;
        }

        .subtitle {
            color: #666;
            line-height: 1.5;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .detail span:first-child {
            color: #666;
        }

        .detail strong {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .amount {
            margin: 22px 0;
            padding: 18px;
            background: #fff1f2;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .amount strong {
            font-size: 25px;
            color: #d91e2b;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #e32636;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 20px;
            font-size: 13px;
        }
    </style>

    <!-- Razorpay's official checkout library -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
    <header>POPOYE <span>INSURANCE</span></header>

    <main>
        <section class="card">
            <h1>Insurance Renewal Checkout</h1>

            <p class="subtitle">
                Review your insurance policy details before continuing to payment.
            </p>

            <div class="detail">
                <span>Policy Number</span>
                <strong id="policyNumber">Loading...</strong>
            </div>

            <div class="detail">
                <span>Customer</span>
                <strong id="customerName">—</strong>
            </div>

            <div class="detail">
                <span>Vehicle Number</span>
                <strong id="vehicleNumber">—</strong>
            </div>

            <div class="detail">
                <span>Policy Expiry</span>
                <strong id="expiryDate">—</strong>
            </div>

            <div class="amount">
                <span>Premium Amount</span>
                <strong id="premium">—</strong>
            </div>

            <button id="payButton" type="button" disabled>
                Continue to Payment
            </button>

            <p id="message" role="status" aria-live="polite">
                Connecting to the server...
            </p>
        </section>
    </main>

    <footer>Popoye Insurance · Secure checkout</footer>

    <script src="checkout.js"></script>
</body>
</html>
